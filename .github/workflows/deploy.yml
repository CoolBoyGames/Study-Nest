name: Deploy StudyNest to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm --workspace=shared run build

      - name: Build static web client for GitHub Pages
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_STATIC_MODE: 'true'
        run: npm --workspace=client run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Wait for any legacy branch Pages build to finish first
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          node -e '
            (async () => {
              const url = `https://api.github.com/repos/${process.env.REPO}/actions/runs?head_sha=${process.env.SHA}&per_page=20`;
              for (let i = 0; i < 30; i++) {
                const res = await fetch(url, {
                  headers: {
                    "User-Agent": "StudyNest-Pages-Sync",
                    Authorization: `Bearer ${process.env.GH_TOKEN}`,
                  },
                });
                if (!res.ok) break;
                const data = await res.json();
                const legacy = (data.workflow_runs || []).find(
                  (r) => r.name === "pages build and deployment"
                );
                if (!legacy) {
                  console.log("No legacy branch Pages run found; deploying now.");
                  break;
                }
                console.log("Legacy branch Pages run:", legacy.status, legacy.conclusion);
                if (legacy.status === "completed") {
                  await new Promise((r) => setTimeout(r, 3000));
                  break;
                }
                await new Promise((r) => setTimeout(r, 3000));
              }
            })();
          '

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
